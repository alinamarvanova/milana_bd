:root{
  --night:#05020c;
  --paper:#fdfbff;
  --ink:#4c1d95;
  --lilac:#e9d5ff;
  --script:'Dancing Script','Snell Roundhand','Segoe Script',cursive;
  --P:min(44vw,240px,calc((100vh - 250px)*.68));
  --H:calc(var(--P)/.68);
}
@supports (height:100dvh){:root{--P:min(44vw,240px,calc((100dvh - 250px)*.68))}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);overflow:hidden;overscroll-behavior:none}
body{color:var(--lilac);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ---------- backgrounds ---------- */
#matrix{z-index:2;opacity:0;transition:opacity 1.1s ease}
#matrix.show{opacity:1}
.sky{position:fixed;inset:0;z-index:1;opacity:0;transition:opacity 1.2s ease;
  background:
    radial-gradient(ellipse 80% 55% at 15% 10%,rgba(126,34,206,.30),transparent 60%),
    radial-gradient(ellipse 70% 50% at 90% 90%,rgba(192,38,211,.20),transparent 60%),
    radial-gradient(ellipse 60% 40% at 70% 35%,rgba(76,29,149,.25),transparent 70%),
    linear-gradient(180deg,#07031a,#0d0624 60%,#120830)}
.sky.show{opacity:1}

/* ---------- intro words ---------- */
.words{position:fixed;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
.words::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 75% 20% at 50% 50%,rgba(5,2,12,.8),rgba(5,2,12,0) 72%);opacity:0;transition:opacity .5s}
.words.active::before{opacity:1}
.w{grid-area:1/1;position:relative;font-family:'ArchivoX','Archivo Black',Impact,sans-serif;line-height:1;white-space:nowrap;color:#f5ecff;letter-spacing:.01em;
  text-shadow:0 0 2px #fff,0 0 12px rgba(216,180,254,.95),0 0 30px rgba(168,85,247,.9),0 0 64px rgba(126,34,206,.85)}
.w.in{animation:wIn .45s cubic-bezier(.2,.9,.3,1.25) both}
.w.out{animation:wOut .28s ease-in both}
.w.out-big{animation:wOutBig 1s cubic-bezier(.5,0,.75,0) both}
@keyframes wIn{from{opacity:0;transform:scale(1.7);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes wOut{to{opacity:0;transform:scale(.82);filter:blur(4px)}}
@keyframes wOutBig{to{opacity:0;transform:scale(1.45);filter:blur(10px)}}

/* ---------- stages ---------- */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .6s ease,visibility 0s linear .6s}
.stage.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .6s ease,visibility 0s}

/* ---------- cake ---------- */
#cake{z-index:4}
.cake-wrap{display:flex;flex-direction:column;align-items:center;transform:translateY(-3vh)}
.balloons{display:flex;flex-direction:column;align-items:center;margin-bottom:4px}
.bl-row{display:flex;justify-content:center;line-height:1.08}
.bl{display:inline-block;font-family:'Fredoka','ArchivoX',system-ui,sans-serif;font-weight:700;font-size:min(11.5vw,54px);color:var(--c);opacity:0}
.bl>i{display:inline-block;font-style:normal;padding:0 .02em;
  text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 2.6px 0 #fff,0 -2.6px 0 #fff,2.6px 0 0 #fff,-2.6px 0 0 #fff,0 6px 0 rgba(30,8,70,.45)}
#cake.show .bl{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*55ms + 200ms)}
#cake.show .bl>i{animation:bob 1.3s ease-in-out infinite;animation-delay:calc(var(--i)*-120ms)}
@keyframes pop{from{opacity:0;transform:scale(0) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}}
.cake-svg{width:min(66vw,290px);height:auto;overflow:visible;transform-origin:50% 92%}
#cake.show .cake-svg{animation:cakeIn .75s cubic-bezier(.3,1.5,.5,1) both .1s,cakeBob 1.5s ease-in-out .85s infinite}
@keyframes cakeIn{from{opacity:0;transform:scale(.3) translateY(40px)}to{opacity:1;transform:none}}
@keyframes cakeBob{0%,100%{transform:none}50%{transform:translateY(-5px) scale(1.012,.99)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .16s ease-in-out infinite alternate}
.flame.b{animation-duration:.21s}
@keyframes flicker{from{transform:scale(1,1) skewX(-4deg)}to{transform:scale(.9,1.1) skewX(4deg)}}
.glow{transform-box:fill-box;transform-origin:50% 50%;animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.65;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}
.flame-g{transition:opacity .3s ease-in,transform .3s ease-in;transform-box:fill-box;transform-origin:50% 100%}
#cake.blown .flame-g{opacity:0;transform:scale(.2)}
.smoke{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
#cake.blown .smoke{animation:smoke 1.2s ease-out .15s forwards}
@keyframes smoke{0%{opacity:0;transform:translateY(0) scale(.6)}25%{opacity:.85}100%{opacity:0;transform:translateY(-28px) scale(1.5)}}
.wish{margin-top:12px;font-family:var(--script);font-weight:700;font-size:clamp(22px,6.4vw,30px);color:#f6edff;text-shadow:0 0 14px rgba(168,85,247,.95);opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
#cake.wish-on .wish{opacity:1;transform:none}

/* ---------- book scene ---------- */
#scene{z-index:5;cursor:pointer;touch-action:pan-y}
.book-area{position:relative;width:calc(var(--P)*2);height:var(--H);transform:translateY(16px);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
#scene.show .book-area{transform:none}
#scene.leaving .book-area{transform:scale(.6);transition:transform .7s cubic-bezier(.5,0,.75,0)}
.book{position:absolute;inset:0;transition:transform .95s cubic-bezier(.645,.045,.355,1)}
.book.closed-front{transform:translateX(calc(var(--P)*-.65)) scale(1.3)}
.book.closed-back{transform:translateX(calc(var(--P)*.575)) scale(1.15)}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:0 50%;transform:perspective(1100px) rotateY(0deg);transform-style:preserve-3d;transition:transform .95s cubic-bezier(.645,.045,.355,1)}
.leaf.flipped{transform:perspective(1100px) rotateY(-180deg)}
.face{position:absolute;inset:0;transform:rotateY(0deg);overflow:hidden;background:var(--paper);border-radius:3px 9px 9px 3px;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.face.back{transform:rotateY(180deg);border-radius:9px 3px 3px 9px}
.face::before{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(90deg,rgba(55,15,100,.24),rgba(55,15,100,0) 13%)}
.face.back::before{background:linear-gradient(270deg,rgba(55,15,100,.24),rgba(55,15,100,0) 13%)}
.face::after{content:'';position:absolute;inset:0;z-index:5;pointer-events:none;background:#2a0b4d;opacity:0}
.leaf.turning .face::after{animation:turnShade .95s ease-in-out}
@keyframes turnShade{50%{opacity:.3}}
.cover,.backcover{background:radial-gradient(rgba(168,85,247,.13) 1px,transparent 1.4px) 0 0/calc(var(--P)*.09) calc(var(--P)*.09),linear-gradient(160deg,#fff,#f2eaff)}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--P)*.05)}
.cover-for{font-family:var(--script);font-weight:700;font-size:calc(var(--P)*.155);color:#6d28d9;transform:rotate(-5deg)}
.gift{width:68%;height:auto;overflow:visible;transform-origin:50% 88%;animation:wiggle 2.8s ease-in-out 1.2s infinite}
@keyframes wiggle{0%,62%,100%{transform:none}68%{transform:rotate(-7deg)}74%{transform:rotate(6deg)}80%{transform:rotate(-4deg)}86%{transform:rotate(2deg)}}
.sp{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 1.8s ease-in-out infinite}
.sp:nth-of-type(2){animation-delay:-.6s}.sp:nth-of-type(3){animation-delay:-1.2s}.sp:nth-of-type(4){animation-delay:-.3s}
@keyframes twinkle{0%,100%{transform:scale(.55);opacity:.55}50%{transform:scale(1.1);opacity:1}}
.backcover{display:grid;place-items:center;text-align:center}
.backcover p{padding:0 8%;font-family:var(--script);font-weight:700;font-size:calc(var(--P)*.115);line-height:1.25;color:#6d28d9;transform:rotate(-5deg)}
.backcover span{display:block;font-size:.8em;color:#d946ef}
.photo{position:absolute;inset:calc(var(--P)*.035);border-radius:4px;overflow:hidden;background:#ece5f7}
.photo img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cap{position:absolute;left:7%;bottom:6%;padding:.05em .5em .12em;background:rgba(253,251,255,.94);color:#5b21b6;font-family:var(--script);font-weight:700;font-size:calc(var(--P)*.085);line-height:1.25;border-radius:4px;transform:rotate(-4deg);box-shadow:0 2px 8px rgba(30,10,60,.3);white-space:nowrap}
.cap.r{left:auto;right:7%;transform:rotate(3deg)}
.plan{--lh:calc(var(--P)*.152)}
.plan-in{position:absolute;inset:0;padding:calc(var(--P)*.12) calc(var(--P)*.09) 0 calc(var(--P)*.13);font-family:var(--script);font-weight:700;color:#4c1d95;font-size:calc(var(--P)*.088);line-height:var(--lh);
  background:linear-gradient(90deg,transparent calc(var(--P)*.085),rgba(236,72,153,.35) calc(var(--P)*.085),rgba(236,72,153,.35) calc(var(--P)*.085 + 1px),transparent calc(var(--P)*.085 + 1px)),
    repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--lh) - 1px),rgba(124,58,237,.17) calc(var(--lh) - 1px),rgba(124,58,237,.17) var(--lh)) 0 calc(var(--P)*.12 + 2px)/100% 100% no-repeat,var(--paper)}
.plan-title{font-size:1.35em;color:#7e22ce;line-height:var(--lh);transform:rotate(-3deg);transform-origin:left center;margin-bottom:calc(var(--lh)*.08)}
.plan ul{list-style:none}
.plan li{position:relative;padding-left:1.45em}
.plan li::before{content:'';position:absolute;left:0;top:calc(var(--lh)*.5 - .48em);width:.9em;height:.9em;border:1.6px solid #7c3aed;border-radius:3px;transform:rotate(-4deg)}
.plan li.done::after{content:'';position:absolute;left:.3em;top:calc(var(--lh)*.5 - .66em);width:.38em;height:.78em;border:solid #ec4899;border-width:0 .17em .17em 0;transform:rotate(40deg) scale(0);transform-origin:60% 85%;transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.plan.reveal li.done::after{transform:rotate(40deg) scale(1)}
.plan.reveal li:nth-child(1)::after{transition-delay:.15s}
.plan.reveal li:nth-child(2)::after{transition-delay:.5s}
.plan.reveal li:nth-child(3)::after{transition-delay:.85s}
.plan em{font-style:normal;color:#a21caf;opacity:0;transition:opacity .5s}
.plan.reveal em{opacity:1;transition-delay:1.35s}
.msg{position:absolute;left:0;right:0;bottom:calc(100% + 16px);min-height:68px;padding:12px 30px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--paper);color:var(--ink);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.45),inset 0 0 0 1px rgba(216,180,254,.6);font-family:var(--script);font-weight:700;font-size:clamp(18px,5.1vw,24px);line-height:1.3;opacity:0;transform:translateY(-10px);transition:opacity .4s ease,transform .4s ease;pointer-events:none}
#scene.opened .msg{opacity:1;transform:none;transition-delay:.45s}
.msg-spark{position:absolute;top:9px;right:10px;width:14px;height:14px;fill:#e879f9;animation:twinkle 1.8s ease-in-out infinite}
.caret{display:inline-block;width:2px;height:1em;margin-left:2px;background:#a855f7;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hint{position:absolute;left:50%;top:calc(100% + 22px);transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:500;letter-spacing:.02em;color:rgba(233,213,255,.85);transition:transform .95s cubic-bezier(.645,.045,.355,1),opacity .4s;animation:pulse 2.2s ease-in-out infinite;pointer-events:none}
#scene.closed .hint{transform:translateX(-50%) translateY(calc(var(--H)*.15 + 6px))}
.hint.gone{opacity:0!important}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

/* ---------- finale ---------- */
#finale{z-index:6}
.fin{display:flex;flex-direction:column;align-items:center;gap:12px}
.nineteen-wrap{--nw:min(74vw,330px,calc(100vh - 290px));width:var(--nw);height:calc(var(--nw)*1.08);perspective:900px}
@supports (height:100dvh){.nineteen-wrap{--nw:min(74vw,330px,calc(100dvh - 290px))}}
.nineteen{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateY(-16deg) rotateX(4deg)}50%{transform:rotateY(16deg) rotateX(-4deg)}}
.tile{position:absolute;width:15%;height:13.889%;transform-style:preserve-3d}
.tile-in{width:100%;height:100%;border-radius:10px;overflow:hidden;border:2px solid #fff;background:#fff;box-shadow:0 0 14px rgba(216,180,254,.9),0 0 3px rgba(255,255,255,.9);animation:wob var(--d) ease-in-out var(--dl) infinite}
.tile-in img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes wob{0%,100%{transform:rotateY(-15deg) rotateZ(-2deg)}50%{transform:rotateY(15deg) rotateZ(2deg)}}
.fin-text{font-family:var(--script);font-weight:700;font-size:clamp(30px,8.6vw,44px);line-height:1.15;color:#f7efff;text-align:center;text-shadow:0 0 16px rgba(168,85,247,.95),0 0 36px rgba(126,34,206,.75);opacity:0;transform:translateY(10px);transition:opacity .7s,transform .7s}
.again{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;border:1px solid rgba(255,255,255,.7);background:#fdfbff;color:#5b21b6;font:600 15px/1 'Poppins',system-ui,-apple-system,sans-serif;box-shadow:0 0 26px rgba(168,85,247,.6);cursor:pointer;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .6s,transform .6s}
.again svg{width:18px;height:18px}
.fin.done .fin-text{opacity:1;transform:none}
.fin.done .again{opacity:1;transform:none;pointer-events:auto;transition-delay:.45s}
.fin.done .again:active{transform:scale(.96)}
.again:focus-visible{outline:3px solid #f0abfc;outline-offset:3px}

/* ---------- music ---------- */
.music{position:fixed;z-index:20;top:14px;right:14px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(20,8,40,.5);border:1px solid rgba(233,213,255,.35);color:#e9d5ff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer;transition:box-shadow .3s,background .3s}
.music svg{width:20px;height:20px}
.music .slash{transition:opacity .2s}
.music.on{background:rgba(88,28,135,.6);box-shadow:0 0 18px rgba(168,85,247,.75)}
.music.on .slash{opacity:0}
.music.on svg{animation:noteBob 1.2s ease-in-out infinite}
@keyframes noteBob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-2px) rotate(6deg)}}
.music:focus-visible{outline:3px solid #f0abfc;outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  .nineteen,.tile-in,.bl>i,.gift,.music.on svg,.hint,.sp{animation:none!important}
  #cake.show .cake-svg{animation:cakeIn .4s ease both}
}
</style>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

const fontLink = document.createElement('link');
fontLink.rel = 'stylesheet';
fontLink.href = 'https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fredoka:wght@700&family=Poppins:wght@500;600&display=swap';
document.head.appendChild(fontLink);

const PHOTO = {
  p1: 'img/p1.jpg',
  p2: 'img/p2.jpg',
  p3: 'img/p3.jpg'
};
const FOCUS = { p1: '50% 30%', p2: '50% 46%', p3: '50% 14%' };
$$('img[data-photo]').forEach(img => { img.src = PHOTO[img.dataset.photo]; });

/* ---------------- music box (public-domain melody, synthesized) ---------------- */
const Music = (() => {
  const btn = $('#music');
  let ctx = null, master = null, verb = null, playing = false, wanted = null, timer = 0, idx = 0, loopAt = 0;
  const BEAT = 60 / 96, LOOP = 28;
  const hz = n => { const m = /^([A-G])(#?)(\d)$/.exec(n); const s = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0); return 440 * Math.pow(2, (12 * (+m[3] + 1) + s - 69) / 12); };
  const MEL = [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3]];
  const EV = [];
  (() => {
    let b = 0; for (const [n, d] of MEL) { EV.push([b, hz(n) * 2, d, .5, 1]); b += d; }
    const CH = [[1,'C'],[4,'G'],[7,'G'],[10,'C'],[13,'C'],[16,'F'],[19,'C'],[21,'G'],[22,'C']];
    const TR = { C: ['C3','G3','E4'], G: ['G2','D3','B3'], F: ['F2','C3','A3'] };
    CH.forEach(([s, c], i) => { const e = i + 1 < CH.length ? CH[i + 1][0] : 25; for (let t = s, k = 0; t < e; t++, k++) EV.push([t, hz(TR[c][k % 3]) * 2, 1.4, k ? .14 : .22, 0]); });
    EV.sort((a, b) => a[0] - b[0]);
  })();
  function impulse() {
    const len = ctx.sampleRate * 2.4, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4); }
    return buf;
  }
  function note(t, f, beats, vel, lead) {
    const dur = beats * BEAT * 1.4 + (lead ? 1.1 : .6);
    const out = ctx.createGain(); out.gain.value = vel; out.connect(master); out.connect(verb);
    [[1, 1, dur], [2, .32, dur * .5], [3.01, .1, dur * .25]].forEach(([mult, amp, d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f * mult, t);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(amp, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + d + .05);
    });
  }
  function tick() {
    if (!playing) return;
    const horizon = ctx.currentTime + .3;
    for (;;) {
      const ev = EV[idx], t = loopAt + ev[0] * BEAT;
      if (t > horizon) break;
      if (t > ctx.currentTime - .02) note(t, ev[1], ev[2], ev[3], ev[4]);
      if (++idx >= EV.length) { idx = 0; loopAt += LOOP * BEAT; }
    }
  }
  function ui() { btn.classList.toggle('on', playing); btn.setAttribute('aria-pressed', String(playing)); btn.setAttribute('aria-label', playing ? 'Turn music off' : 'Turn music on'); }
  function play() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        ctx = new AC(); master = ctx.createGain(); master.gain.value = .0001; master.connect(ctx.destination);
        const conv = ctx.createConvolver(); conv.buffer = impulse(); verb = ctx.createGain(); verb.gain.value = .35; verb.connect(conv); conv.connect(master);
        loopAt = ctx.currentTime + .15; idx = 0;
      }
      const r = ctx.resume(); if (r && r.catch) r.catch(() => {});
      master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(.32, ctx.currentTime, .15);
      if (loopAt < ctx.currentTime) { loopAt = ctx.currentTime + .15; idx = 0; }
      playing = true; clearInterval(timer); timer = setInterval(tick, 90); tick(); ui();
    } catch (e) { playing = false; ui(); }
  }
  function pause() {
    playing = false; clearInterval(timer); ui();
    if (!ctx) return;
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(.0001, ctx.currentTime, .08);
    setTimeout(() => { if (!playing && ctx) ctx.suspend().catch(() => {}); }, 400);
  }
  btn.addEventListener('click', () => { if (playing) { wanted = false; pause(); } else { wanted = true; play(); } });
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend().catch(() => {}); else if (playing) ctx.resume().catch(() => {});
  });
  return { auto: () => { if (wanted !== false && !playing) play(); } };
})();

/* ---------------- purple matrix rain ---------------- */
const Matrix = (() => {
  const cv = $('#matrix'), g = cv.getContext('2d');
  const CH = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789MILANA'.split('');
  const TONES = ['#9333ea', '#a855f7', '#a855f7', '#c084fc'];
  let W = 0, H = 0, fs = 14, nc = 0, nr = 0, grid = [], cols = [], raf = 0, last = 0, on = false;
  const stream = first => ({ y: first ? -rnd(0, nr * .85) : -rnd(1, nr * .35), v: rnd(10, 24), len: rnd(12, 32) | 0, b: rnd(.5, 1), c: pick(TONES) });
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    fs = W < 480 ? 14 : 16; nc = Math.ceil(W / fs); nr = Math.ceil(H / fs) + 1;
    for (let c = 0; c < nc; c++) {
      if (!grid[c]) grid[c] = [];
      for (let r = grid[c].length; r < nr; r++) grid[c][r] = pick(CH);
      if (!cols[c]) { cols[c] = [stream(true)]; if (Math.random() < .5) { const s = stream(true); s.y -= nr * .55; cols[c].push(s); } }
    }
    grid.length = nc; cols.length = nc;
  }
  function frame(t) {
    if (!on) return;
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.05, (t - last) / 1000 || .016); last = t;
    g.globalAlpha = 1; g.fillStyle = '#05020c'; g.fillRect(0, 0, W, H);
    g.font = fs + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","MS Gothic",monospace';
    g.textAlign = 'center'; g.textBaseline = 'top';
    for (let k = 0, m = nc * 2; k < m; k++) grid[(Math.random() * nc) | 0][(Math.random() * nr) | 0] = pick(CH);
    for (let c = 0; c < nc; c++) {
      const x = c * fs + fs / 2, col = grid[c];
      for (const s of cols[c]) {
        s.y += s.v * dt;
        const head = Math.floor(s.y);
        if (head - s.len > nr) { Object.assign(s, stream(false)); continue; }
        g.fillStyle = s.c;
        for (let r = Math.max(0, head - s.len), end = Math.min(nr - 1, head - 1); r <= end; r++) {
          g.globalAlpha = s.b * (.1 + .9 * (1 - (head - r) / s.len));
          g.fillText(col[r], x, r * fs);
        }
        if (head >= 0 && head < nr) {
          g.globalAlpha = 1; g.fillStyle = '#f8f0ff'; g.shadowColor = '#d8b4fe'; g.shadowBlur = 8;
          g.fillText(col[head], x, head * fs); g.shadowBlur = 0;
        }
      }
    }
  }
  function start() { grid = []; cols = []; fit(); on = true; last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  function stop() { on = false; cancelAnimationFrame(raf); }
  addEventListener('resize', () => { if (on) fit(); });
  return { start, stop };
})();

/* ---------------- big intro words ---------------- */
const Words = (() => {
  const box = $('#words'), m = document.createElement('canvas').getContext('2d');
  const per = w => { m.font = '100px ArchivoX, "Archivo Black", Impact, sans-serif'; return m.measureText(w).width / 100; };
  function size(w) {
    const W = innerWidth, H = innerHeight;
    const base = Math.min(.84 * W / per('BIRTHDAY'), H * .13, 130);
    if (/^\d$/.test(w)) return Math.min(base * 2.4, H * .32, 300);
    return Math.min(.86 * W / per(w), base * 1.3);
  }
  async function show(w, hold, big) {
    const s = document.createElement('span');
    s.className = 'w in'; s.textContent = w; s.style.fontSize = size(w).toFixed(1) + 'px';
    box.appendChild(s);
    await sleep(hold);
    s.className = big ? 'w out-big' : 'w out';
    setTimeout(() => s.remove(), 1100);
  }
  return { show, active: on => box.classList.toggle('active', on) };
})();

/* ---------------- starry sky + sparkles ---------------- */
const Sky = (() => {
  const cv = $('#stars'), g = cv.getContext('2d');
  const COLORS = ['#f0abfc', '#d8b4fe', '#e9d5ff', '#f9a8d4', '#c4b5fd'];
  let W = 0, H = 0, dpr = 1, stars = [], parts = [], shoot = null, nextShoot = 3, raf = 0, last = 0, on = false;
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  const sprites = {};
  COLORS.forEach(col => {
    const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
    const rg = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, rgba(col, .55)); rg.addColorStop(.4, rgba(col, .16)); rg.addColorStop(1, rgba(col, 0));
    x.fillStyle = rg; x.fillRect(0, 0, 64, 64);
    const star = (r, fill) => { x.beginPath(); x.moveTo(32, 32 - r); x.quadraticCurveTo(32, 32, 32 + r, 32); x.quadraticCurveTo(32, 32, 32, 32 + r); x.quadraticCurveTo(32, 32, 32 - r, 32); x.quadraticCurveTo(32, 32, 32, 32 - r); x.fillStyle = fill; x.fill(); };
    star(15, col); star(6, 'rgba(255,255,255,.95)');
    sprites[col] = c;
  });
  function fit() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const n = Math.round(W * H / 2300);
    stars = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() < .07 ? rnd(1.1, 1.8) : rnd(.35, 1), a: rnd(.35, 1), s: rnd(.6, 2.4), p: Math.random() * 6.3 }));
  }
  function float() { parts.push({ x: rnd(0, W), y: H * rnd(.3, 1.02), vx: rnd(-6, 6), vy: -rnd(8, 24), r: rnd(3, 6.5), rot: rnd(0, 6.3), vr: rnd(-1, 1), life: 0, max: rnd(4, 8), col: pick(COLORS), g: 0, drag: 1, fl: 1 }); }
  function burst(x, y, n = 54) {
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, sp = rnd(70, 260); parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rnd(2.5, 6), rot: rnd(0, 6.3), vr: rnd(-5, 5), life: 0, max: rnd(1.1, 2.1), col: pick(COLORS), g: 70, drag: .955, fl: 0 }); }
  }
  function frame(t) {
    if (!on) return;
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.05, (t - last) / 1000 || .016); last = t; const time = t / 1000;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    g.fillStyle = '#fff';
    for (const s of stars) {
      g.globalAlpha = s.a * (.5 + .5 * Math.sin(time * s.s + s.p));
      if (s.r < .8) g.fillRect(s.x - s.r, s.y - s.r, s.r * 2, s.r * 2);
      else { g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.283); g.fill(); if (s.r > 1.3) { g.globalAlpha *= .45; g.fillRect(s.x - s.r * 3, s.y - .4, s.r * 6, .8); g.fillRect(s.x - .4, s.y - s.r * 3, .8, s.r * 6); } }
    }
    if (!REDUCE && time > nextShoot && !shoot) { shoot = { x: rnd(W * .35, W * 1.05), y: rnd(-10, H * .3), vx: -rnd(380, 520), vy: rnd(150, 230), life: 0, max: rnd(.7, 1) }; nextShoot = time + rnd(4.5, 9); }
    if (shoot) {
      shoot.life += dt; shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt;
      const k = shoot.life / shoot.max, tx = shoot.x - shoot.vx * .18, ty = shoot.y - shoot.vy * .18;
      const lg = g.createLinearGradient(shoot.x, shoot.y, tx, ty);
      lg.addColorStop(0, `rgba(255,255,255,${Math.max(0, 1 - k)})`); lg.addColorStop(1, 'rgba(216,180,254,0)');
      g.globalAlpha = 1; g.strokeStyle = lg; g.lineWidth = 1.6; g.lineCap = 'round';
      g.beginPath(); g.moveTo(shoot.x, shoot.y); g.lineTo(tx, ty); g.stroke();
      if (k >= 1) shoot = null;
    }
    let floaters = 0; for (const p of parts) floaters += p.fl;
    if (floaters < 14 && Math.random() < dt * 2.4) float();
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life += dt;
      if (p.life >= p.max) { parts.splice(i, 1); continue; }
      if (p.drag !== 1) { const d = Math.pow(p.drag, dt * 60); p.vx *= d; p.vy *= d; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const k = p.life / p.max, a = k < .15 ? k / .15 : (1 - k) / .85, sz = p.r * 4.6, c = Math.cos(p.rot) * dpr, s = Math.sin(p.rot) * dpr;
      g.setTransform(c, s, -s, c, p.x * dpr, p.y * dpr); g.globalAlpha = a;
      g.drawImage(sprites[p.col], -sz / 2, -sz / 2, sz, sz);
    }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function start() { if (on) return; fit(); on = true; last = performance.now(); raf = requestAnimationFrame(frame); }
  function stop() { on = false; cancelAnimationFrame(raf); parts = []; }
  addEventListener('resize', () => { if (on) fit(); });
  return { start, stop, burst };
})();

/* ---------------- typewriter ---------------- */
const Typer = (() => {
  const el = $('#msgText'); let tok = 0;
  async function typeIn(text, my) {
    el.textContent = '';
    for (const ch of Array.from(text)) { if (my !== tok) return; el.textContent += ch; await sleep(ch === ' ' ? 40 : 50 + Math.random() * 40); }
  }
  async function eraseOut(my) {
    const s = Array.from(el.textContent);
    while (s.length) { if (my !== tok) return false; s.pop(); el.textContent = s.join(''); await sleep(14); }
    return true;
  }
  return {
    type: t => typeIn(t, ++tok),
    swap: async t => { const my = ++tok; if (!(await eraseOut(my))) return; await sleep(160); if (my === tok) typeIn(t, my); },
    clear: () => { ++tok; el.textContent = ''; }
  };
})();

/* ---------------- flip book ---------------- */
const Book = (() => {
  const scene = $('#scene'), book = $('#book'), leaves = $$('.leaf', book), hint = $('#hint'), plan = $('.plan');
  const MSG = ['Happy Birthday, Milana ✦', 'Keep looking up, the best is yet to come ✦'];
  let flipped = 0, busy = false, state = 'closed', done = null;
  const order = () => leaves.forEach((l, i) => { l.style.zIndex = i < flipped ? i + 1 : 20 + leaves.length - i; });
  function reset() {
    flipped = 0; busy = false; state = 'closed'; Typer.clear();
    leaves.forEach(l => { l.style.transition = 'none'; l.classList.remove('flipped', 'turning'); });
    book.style.transition = 'none'; book.className = 'book closed-front';
    scene.classList.remove('opened', 'leaving'); scene.classList.add('closed');
    hint.textContent = 'Tap to open'; hint.classList.remove('gone'); plan.classList.remove('reveal');
    order(); void book.offsetWidth;
    leaves.forEach(l => { l.style.transition = ''; }); book.style.transition = '';
  }
  function turn(i, fwd) {
    const l = leaves[i]; l.style.zIndex = 60; l.classList.add('turning'); l.classList.toggle('flipped', fwd);
    return sleep(980).then(() => l.classList.remove('turning'));
  }
  async function next() {
    if (busy || state === 'done') return;
    busy = true;
    if (state === 'closed') {
      Music.auto();
      state = 'open';
      scene.classList.remove('closed'); scene.classList.add('opened');
      book.classList.remove('closed-front');
      hint.textContent = 'Tap the page';
      await turn(0, true); flipped = 1; order();
      Typer.type(MSG[0]);
    } else if (flipped === 1) {
      Typer.swap(MSG[1]);
      await turn(1, true); flipped = 2; order();
      plan.classList.add('reveal');
    } else if (flipped === 2) {
      state = 'done';
      scene.classList.remove('opened'); hint.classList.add('gone'); setTimeout(Typer.clear, 420);
      await turn(2, true); flipped = 3; order();
      book.classList.add('closed-back');
      await sleep(1400);
      if (done) done();
    }
    busy = false;
  }
  async function prev() {
    if (busy || state !== 'open' || flipped !== 2) return;
    busy = true; Typer.swap(MSG[0]); plan.classList.remove('reveal');
    await turn(1, false); flipped = 1; order(); busy = false;
  }
  let dx0 = 0, dy0 = 0, swipedAt = 0;
  scene.addEventListener('pointerdown', e => { dx0 = e.clientX; dy0 = e.clientY; });
  scene.addEventListener('pointerup', e => {
    const dx = e.clientX - dx0, dy = e.clientY - dy0;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) { swipedAt = performance.now(); if (dx < 0) next(); else prev(); }
  });
  scene.addEventListener('click', e => {
    if (performance.now() - swipedAt < 450) return;
    const r = $('#bookArea').getBoundingClientRect();
    if (state === 'open' && flipped === 2 && e.clientX < r.left + r.width / 2 - 8) prev(); else next();
  });
  document.addEventListener('keydown', e => {
    if (!scene.classList.contains('show') || e.target.closest('button')) return;
    if (['ArrowRight', 'Enter', ' '].includes(e.key)) { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') prev();
  });
  return { reset, set onDone(f) { done = f; } };
})();

/* ---------------- finale: "19" made of photos ---------------- */
const Finale = (() => {
  const st = $('#finale'), fin = $('#fin'), box = $('#nineteen');
  const ASPECT = 1.08, STEP = .138;
  const line = (a, b, n = 60) => Array.from({ length: n + 1 }, (_, i) => [a[0] + (b[0] - a[0]) * i / n, a[1] + (b[1] - a[1]) * i / n]);
  const arc = (cx, cy, r, a0, a1, n = 200) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
  const quad = (p0, p1, p2, n = 120) => Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]; });
  function even(pts, approx, withStart, withEnd) {
    const acc = [0]; for (let i = 1; i < pts.length; i++) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const L = acc[acc.length - 1], n = Math.max(1, Math.round(L / approx)), out = [];
    for (let k = withStart ? 0 : 1; k <= (withEnd ? n : n - 1); k++) {
      const d = L * k / n; let j = 1; while (j < acc.length - 1 && acc[j] < d) j++;
      const seg = acc[j] - acc[j - 1] || 1, t = (d - acc[j - 1]) / seg;
      out.push([pts[j - 1][0] + (pts[j][0] - pts[j - 1][0]) * t, pts[j - 1][1] + (pts[j][1] - pts[j - 1][1]) * t]);
    }
    return out;
  }
  function shape() {
    return [
      ...even(line([.10, .28], [.25, .13]), STEP, true, false),
      ...even(line([.25, .13], [.25, .97]), STEP, true, true),
      ...even(arc(.685, .34, .215, 0, -Math.PI * 2), STEP, true, false),
      ...even(quad([.9, .34], [.925, .93], [.55, 1.0]), STEP, false, true)
    ];
  }
  function build() {
    box.replaceChildren();
    const keys = ['p2', 'p3', 'p1'];
    shape().forEach(([x, y], i) => {
      const k = keys[i % 3], z = Math.round(rnd(-28, 28));
      const t = document.createElement('div'); t.className = 'tile';
      t.style.left = (x * 100).toFixed(2) + '%'; t.style.top = (y / ASPECT * 100).toFixed(2) + '%';
      t.dataset.z = z; t.style.transform = `translate(-50%,-50%) translate3d(0px,0px,${z}px) rotateY(0deg) scale(1)`;
      const inner = document.createElement('div'); inner.className = 'tile-in';
      inner.style.setProperty('--d', rnd(2.6, 4.2).toFixed(2) + 's'); inner.style.setProperty('--dl', (-rnd(0, 4)).toFixed(2) + 's');
      const img = document.createElement('img'); img.alt = ''; img.src = PHOTO[k]; img.style.objectPosition = FOCUS[k];
      inner.appendChild(img); t.appendChild(inner); box.appendChild(t);
    });
  }
  async function play(id) {
    build(); fin.classList.remove('done'); st.classList.add('show');
    const W = box.offsetWidth, H = box.offsetHeight, tiles = [...box.children], gap = 85, dur = 1000;
    if (!REDUCE) tiles.forEach((t, i) => {
      const x = parseFloat(t.style.left) / 100 * W, y = parseFloat(t.style.top) / 100 * H, z = t.dataset.z;
      t.animate([
        { transform: `translate(-50%,-50%) translate3d(${(W / 2 - x).toFixed(1)}px,${(H / 2 - y).toFixed(1)}px,-260px) rotateY(180deg) scale(.2)`, opacity: 0 },
        { opacity: 1, offset: .3 },
        { transform: `translate(-50%,-50%) translate3d(0px,0px,${z}px) rotateY(0deg) scale(1)`, opacity: 1 }
      ], { duration: dur, delay: 250 + i * gap, easing: 'cubic-bezier(.22,.9,.25,1)', fill: 'backwards' });
    });
    await sleep(REDUCE ? 400 : 250 + (tiles.length - 1) * gap + dur);
    if (id !== runId) return;
    const r = box.getBoundingClientRect();
    Sky.burst(r.left + r.width / 2, r.top + r.height / 2);
    fin.classList.add('done');
  }
  function hide() { st.classList.remove('show'); fin.classList.remove('done'); }
  return { play, hide, reset: () => box.replaceChildren() };
})();

/* ---------------- the show ---------------- */
let runId = 0;
const sky = $('#sky'), matrix = $('#matrix'), cake = $('#cake'), scene = $('#scene');

(() => {
  const colors = ['#f472b6', '#a78bfa', '#facc15', '#34d399', '#60a5fa', '#fb923c'];
  const box = $('#balloons'); let i = 0;
  ['HAPPY', 'BIRTHDAY'].forEach(word => {
    const row = document.createElement('div'); row.className = 'bl-row';
    for (const ch of word) {
      const o = document.createElement('span'); o.className = 'bl';
      o.style.setProperty('--i', i); o.style.setProperty('--c', colors[i % colors.length]);
      const inner = document.createElement('i'); inner.textContent = ch; o.appendChild(inner); row.appendChild(o); i++;
    }
    box.appendChild(row);
  });
})();

async function intro(id) {
  sky.classList.remove('show');
  setTimeout(() => { if (!sky.classList.contains('show')) Sky.stop(); }, 1300);
  Matrix.start(); matrix.classList.add('show');
  await sleep(1500); if (id !== runId) return false;
  Words.active(true);
  const seq = [['3', 760], ['2', 760], ['1', 760], ['HAPPY', 1100], ['BIRTHDAY', 1150], ['TO', 850], ['MILANA', 2100]];
  for (const [w, hold] of seq) { if (id !== runId) return false; await Words.show(w, hold, w === 'MILANA'); await sleep(140); }
  Words.active(false);
  Sky.start(); sky.classList.add('show'); matrix.classList.remove('show');
  await sleep(1150); Matrix.stop();
  return id === runId;
}

async function cakeShow(id) {
  cake.classList.remove('blown', 'wish-on');
  cake.classList.add('show');
  await sleep(1500); if (id !== runId) return false;
  cake.classList.add('wish-on');
  await sleep(1800); if (id !== runId) return false;
  cake.classList.add('blown');
  await sleep(1100); if (id !== runId) return false;
  cake.classList.remove('show');
  await sleep(700);
  return id === runId;
}

async function run(id) {
  if (!(await intro(id))) return;
  if (!(await cakeShow(id))) return;
  Book.reset(); scene.classList.add('show');
}

Book.onDone = async () => {
  const id = runId;
  scene.classList.add('leaving'); scene.classList.remove('show');
  await sleep(750); if (id !== runId) return;
  Finale.play(id);
};

$('#again').addEventListener('click', async () => {
  const id = ++runId;
  Finale.hide();
  await sleep(700); if (id !== runId) return;
  Finale.reset(); Book.reset(); scene.classList.remove('show');
  run(id);
});

(async () => {
  try { await Promise.race([document.fonts.load('100px ArchivoX'), sleep(1200)]); } catch (e) {}
  run(runId);
})();
})();
</script>
